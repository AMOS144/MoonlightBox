name: docker-publish

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docker-publish.yml"
      - "Dockerfile.allinone"
      - "docker/**"
      - "backend/**"
      - "frontend/**"
      - "sidecars/**"
      - "pyproject.toml"
      - "uv.lock"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 计算小写镜像名
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送 All-in-One 镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.allinone
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:latest
            ${{ steps.image.outputs.name }}:sha-${{ github.sha }}
          cache-from: type=gha,scope=allinone
          cache-to: type=gha,mode=max,scope=allinone
