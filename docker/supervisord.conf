[supervisord]
nodaemon=true
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[program:lightrag-sidecar]
command=/app/.venv/bin/moonlightbox-lightrag-sidecar
directory=/app
priority=10
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:backend]
command=/app/.venv/bin/uvicorn moonlightbox.api:app --app-dir backend --host 127.0.0.1 --port 8000
directory=/app
priority=20
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker-realtime]
command=/app/.venv/bin/python -m moonlightbox.worker_main
directory=/app
environment=MOONLIGHTBOX_WORKER_ROLE="realtime"
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker-cognition]
command=/app/.venv/bin/python -m moonlightbox.worker_main
directory=/app
environment=MOONLIGHTBOX_WORKER_ROLE="cognition"
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:worker-background]
command=/app/.venv/bin/python -m moonlightbox.worker_main
directory=/app
environment=MOONLIGHTBOX_WORKER_ROLE="background"
priority=30
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0

[program:nginx]
command=nginx -g "daemon off;"
priority=40
autorestart=true
stdout_logfile=/dev/fd/1
stdout_logfile_maxbytes=0
stderr_logfile=/dev/fd/2
stderr_logfile_maxbytes=0
